spring:
  datasource:
    url: jdbc:mysql://${TIDB_HOST:gateway01.ap-northeast-1.prod.aws.tidbcloud.com}:${TIDB_PORT:4000}/${TIDB_DATABASE:expense_tracker}?sslMode=VERIFY_IDENTITY&useSSL=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${TIDB_USERNAME:3FkEjb5f2yeAfhG.root}
    password: ${TIDB_PASSWORD:5YS33dbR4RDFDA5I}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      keepalive-time: 30000
      validation-timeout: 3000
  jpa:
